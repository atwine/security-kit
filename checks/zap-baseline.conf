# security-kit default ZAP baseline rules: rule id, level, name (tab-separated).
# FAIL breaks the scan; WARN only reports; IGNORE hides.
# A project can pass its own copy (rules-file input) to accept a finding,
# with a comment saying why. The kit's own website check reads the same
# file: a line such as "KIT-HSTS<tab>IGNORE<tab>(reason)" accepts one of its
# findings (KIT-HSTS, KIT-REFERRER, KIT-PERMISSIONS, KIT-COOKIE-SECURE,
# KIT-COOKIE-SAMESITE, KIT-CORS; see checks/site_policy.py).
