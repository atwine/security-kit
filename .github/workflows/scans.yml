# security-kit: the checks that read a project's code and settings.
#
# A project calls this workflow, pinned to a kit release:
#
#   jobs:
#     security:
#       uses: atwine/security-kit/.github/workflows/scans.yml@<full commit SHA> # vX.Y.Z
#
# Checks: leaked secrets in the history (gitleaks), risky code patterns
# (Semgrep), exact version pins (checks/pins.py), Python and JavaScript
# libraries with known holes (pip-audit, npm audit), and the project's own
# access-rule tests when it has them (written by the access-guard skill).
#
# Two jobs. "Run the checks" runs every check and lets GitHub record each
# one's result. "Security checks (security-kit)" then decides pass or fail on
# a fresh machine, from that record, so nothing the project's code does while
# the checks run can change the verdict. Require the check named
# "Security checks (security-kit)" in branch protection.
name: security-kit scans

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding the app; the secrets and workflow checks always cover the whole repository
        type: string
        default: "."
      semgrep-config:
        description: Semgrep rule set
        type: string
        default: "p/default"
      access-tests:
        description: The project's access-rule tests, relative to working-directory; skipped when the file doesn't exist
        type: string
        default: "tests/test_access.py"
      fail-on-findings:
        description: The kit's own self-test sets this to false to read results; for any other repository it is ignored and findings fail the check
        type: boolean
        default: true
      self-test-defect:
        description: Used only by the kit's own self-test; any other repository that sets it fails
        type: string
        default: ""
    outputs:
      results:
        description: "JSON: check name -> success or failure, from GitHub's record of each check step"
        value: >-
          {"secrets": "${{ jobs.scan.outputs.secrets }}",
          "risky_code": "${{ jobs.scan.outputs.risky_code }}",
          "pins": "${{ jobs.scan.outputs.pins }}",
          "node_libraries": "${{ jobs.scan.outputs.node_libraries }}",
          "python_libraries": "${{ jobs.scan.outputs.python_libraries }}",
          "access_rules": "${{ jobs.scan.outputs.access_rules }}"}
      evidence:
        description: "Filled only in the kit's own repository, for its self-test (empty everywhere else): JSON check name -> what that check's tool reported"
        value: ${{ jobs.scan.outputs.evidence }}

permissions:
  contents: read

jobs:
  scan:
    name: Run the checks (security-kit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The six check values are GitHub's own record of how each check step
    # ended; no script writes them. evidence is written by a script, is
    # filled only in the kit's own repository for its self-test, and never
    # decides a project's verdict.
    outputs:
      secrets: ${{ steps.secrets.outcome }}
      risky_code: ${{ steps.risky_code.outcome }}
      pins: ${{ steps.pins.outcome }}
      node_libraries: ${{ steps.node_libraries.outcome }}
      python_libraries: ${{ steps.python_libraries.outcome }}
      access_rules: ${{ steps.access_rules.outcome }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - name: Refuse events that check out the wrong code
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::security-kit can't run from $EVENT: that event checks out the base branch, not the change, so every change would pass. Call it from push or pull_request."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the kit's own scripts, at the same version as this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-kit
          persist-credentials: false

      # Each check also writes its tool's report to $RUNNER_TEMP/reports.
      # Semgrep writes from its own container, so that folder is open to it.
      - name: Move the kit's files out of the project's folder
        run: |
          mv .security-kit "$RUNNER_TEMP/security-kit"
          mkdir -p "$RUNNER_TEMP/reports"
          chmod 777 "$RUNNER_TEMP/reports"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Plant a known defect (kit self-test only)
        if: inputs.self-test-defect != ''
        env:
          DEFECT: ${{ inputs.self-test-defect }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then
            echo "::error::self-test-defect is for the kit's own self-test only."
            exit 1
          fi
          python -I "$RUNNER_TEMP/security-kit/selftest/plant.py" "$DEFECT" "$WD"
          git add -A -- "$WD"
          git -c user.name=self-test -c user.email=self-test@example.invalid commit -q -m "self-test: plant $DEFECT"

      - name: Install the scanners (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pip install --quiet pip-audit==2.10.1

      # These checks only read the project's files, so they run before
      # anything that executes the project's code.
      - id: secrets
        name: Leaked secrets in the history (gitleaks)
        continue-on-error: true
        run: gitleaks git --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/reports/gitleaks.json" .

      - id: risky_code
        name: Risky code patterns (Semgrep)
        continue-on-error: true
        env:
          CONFIG: ${{ inputs.semgrep-config }}
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/reports:/reports" -w /src \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config "$CONFIG" --error --metrics off --quiet --json-output=/reports/semgrep.json "$WD"

      - id: pins
        name: Libraries and actions pinned to exact versions
        continue-on-error: true
        run: python -I "$RUNNER_TEMP/security-kit/checks/pins.py" "$WD" --report "$RUNNER_TEMP/reports/pins.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        with:
          node-version: "22"

      - id: node_libraries
        name: JavaScript libraries with known holes (npm audit, high and critical)
        continue-on-error: true
        run: |
          if [ ! -f "$WD/package-lock.json" ]; then echo "No package-lock.json."; exit 0; fi
          cd "$WD"
          status=0
          npm audit --audit-level=high --omit=dev --json > "$RUNNER_TEMP/reports/npm-audit.json" || status=$?
          python -I "$RUNNER_TEMP/security-kit/checks/findings.py" show npm "$RUNNER_TEMP/reports/npm-audit.json"
          exit $status

      # These two run the project's code (building packages, running its
      # tests), so they come last. They can't change the results above, and
      # the verdict is decided in a separate job.
      - id: python_libraries
        name: Python libraries with known holes (pip-audit)
        continue-on-error: true
        run: |
          files=$(git ls-files -- "$WD" | grep -E '(^|/)[^/]*requirements[^/]*\.txt$' || true)
          if [ -z "$files" ]; then echo "No requirements files."; exit 0; fi
          status=0
          n=0
          for f in $files; do
            n=$((n + 1))
            report="$RUNNER_TEMP/reports/pip-audit-$n.json"
            echo "::group::$f"
            pip-audit --progress-spinner off --format json --output "$report" -r "$f" || status=1
            python -I "$RUNNER_TEMP/security-kit/checks/findings.py" show pip-audit "$report"
            echo "::endgroup::"
          done
          exit $status

      - id: access_rules
        name: Every route has an access rule (the project's access tests)
        continue-on-error: true
        env:
          TESTS: ${{ inputs.access-tests }}
        run: |
          cd "$WD"
          if [ ! -f "$TESTS" ]; then echo "No access tests at $TESTS. The access-guard skill writes them."; exit 0; fi
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          python -m pytest -q -p no:cacheprovider --junitxml "$RUNNER_TEMP/reports/access-tests.xml" "$TESTS"

      # In the kit's own repository only: list what each check's tool
      # reported, so the self-test can prove each catch is the defect it
      # planted. Every other repository skips this, and the verdict below
      # never reads it.
      - id: evidence
        name: What each check reported (kit's own repository only)
        if: always()
        env:
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then echo "Only the kit's own repository uses this."; exit 0; fi
          evidence=$(python -I "$RUNNER_TEMP/security-kit/checks/findings.py" evidence-code "$RUNNER_TEMP/reports")
          echo "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

  verdict:
    name: Security checks (security-kit)
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A fresh machine: none of the project's code has run here. Only the
      # kit's own files are fetched, at the same version as this workflow.
      - name: Fetch the kit's decision script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kit
          persist-credentials: false

      - name: Decide from GitHub's record of each check (checks/gate.py)
        env:
          NEEDS: ${{ toJSON(needs) }}
          ASKED_REPORT_ONLY: ${{ !inputs.fail-on-findings }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: python3 -I kit/checks/gate.py
