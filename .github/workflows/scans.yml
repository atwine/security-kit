# security-kit: the checks that read a project's code and settings.
#
# A project calls this workflow, pinned to a kit release:
#
#   jobs:
#     security:
#       uses: atwine/security-kit/.github/workflows/scans.yml@<full commit SHA> # vX.Y.Z
#
# Checks: leaked secrets in the history (gitleaks), Python and JavaScript
# libraries with known holes (pip-audit, npm audit), risky code patterns
# (Semgrep), exact version pins (checks/pins.py), and the project's own
# access-rule tests when it has them (written by the access-guard skill).
name: security-kit scans

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding the app; the secrets and workflow checks always cover the whole repository
        type: string
        default: "."
      semgrep-config:
        description: Semgrep rule set
        type: string
        default: "p/default"
      access-tests:
        description: The project's access-rule tests, relative to working-directory; skipped when the file doesn't exist
        type: string
        default: "tests/test_access.py"
      fail-on-findings:
        description: Fail the job when a check finds something (the kit's self-test turns this off to read the results)
        type: boolean
        default: true
      self-test-defect:
        description: Used only by the kit's own self-test
        type: string
        default: ""
    outputs:
      results:
        description: "JSON: check name -> success or failure"
        value: ${{ jobs.scan.outputs.results }}

permissions:
  contents: read

jobs:
  scan:
    name: Security checks (security-kit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      results: ${{ steps.summary.outputs.results }}
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the kit's own scripts, at the same version as this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-kit
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Plant a known defect (kit self-test only)
        if: inputs.self-test-defect != ''
        env:
          DEFECT: ${{ inputs.self-test-defect }}
        run: |
          python .security-kit/selftest/plant.py "$DEFECT" "$WD"
          git add -A -- "$WD"
          git -c user.name=self-test -c user.email=self-test@example.invalid commit -q -m "self-test: plant $DEFECT"

      - name: Install the scanners (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pip install --quiet pip-audit==2.10.1

      - id: secrets
        name: Leaked secrets in the history (gitleaks)
        continue-on-error: true
        run: gitleaks git --redact --no-banner .

      - id: python_libraries
        name: Python libraries with known holes (pip-audit)
        continue-on-error: true
        run: |
          files=$(git ls-files -- "$WD" | grep -E '(^|/)[^/]*requirements[^/]*\.txt$' || true)
          if [ -z "$files" ]; then echo "No requirements files."; exit 0; fi
          status=0
          for f in $files; do
            echo "::group::$f"
            pip-audit --progress-spinner off -r "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        with:
          node-version: "22"

      - id: node_libraries
        name: JavaScript libraries with known holes (npm audit, high and critical)
        continue-on-error: true
        run: |
          if [ ! -f "$WD/package-lock.json" ]; then echo "No package-lock.json."; exit 0; fi
          cd "$WD"
          npm audit --audit-level=high --omit=dev

      - id: risky_code
        name: Risky code patterns (Semgrep)
        continue-on-error: true
        env:
          CONFIG: ${{ inputs.semgrep-config }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config "$CONFIG" --error --metrics off --quiet --exclude .security-kit "$WD"

      - id: pins
        name: Libraries and actions pinned to exact versions
        continue-on-error: true
        run: python .security-kit/checks/pins.py "$WD"

      - id: access_rules
        name: Every route has an access rule (the project's access tests)
        continue-on-error: true
        env:
          TESTS: ${{ inputs.access-tests }}
        run: |
          cd "$WD"
          if [ ! -f "$TESTS" ]; then echo "No access tests at $TESTS. The access-guard skill writes them."; exit 0; fi
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          python -m pytest -q -p no:cacheprovider "$TESTS"

      - id: summary
        name: Results
        if: always()
        env:
          RESULTS: >-
            {"secrets": "${{ steps.secrets.outcome }}",
            "python_libraries": "${{ steps.python_libraries.outcome }}",
            "node_libraries": "${{ steps.node_libraries.outcome }}",
            "risky_code": "${{ steps.risky_code.outcome }}",
            "pins": "${{ steps.pins.outcome }}",
            "access_rules": "${{ steps.access_rules.outcome }}"}
        run: |
          python - <<'EOF'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          lines = ["| Check | Result |", "|---|---|"]
          lines += [f"| {name} | {'found something' if outcome == 'failure' else outcome} |" for name, outcome in results.items()]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("results=" + json.dumps(results) + "\n")
          EOF

      - name: Fail when a check found something
        if: inputs.fail-on-findings && contains(steps.summary.outputs.results, 'failure')
        run: |
          echo "At least one check found something. Open its step above for the details."
          exit 1
