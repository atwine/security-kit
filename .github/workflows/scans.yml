# security-kit: the checks that read a project's code and settings.
#
# A project calls this workflow, pinned to a kit release:
#
#   jobs:
#     code:
#       uses: atwine/security-kit/.github/workflows/scans.yml@<full commit SHA> # vX.Y.Z
#
# Checks: leaked secrets in the history (gitleaks), risky code patterns
# (Semgrep), exact version pins (checks/pins.py), Python and JavaScript
# libraries with known holes (pip-audit, npm audit), and the project's own
# access-rule tests when it has them (written by the access-guard skill).
#
# Three jobs:
# - "Run the checks that only read the project" runs gitleaks, Semgrep, the
#   pin check and npm audit. None of the project's code runs on that machine,
#   though the tools still read the project's own settings files.
# - "Run the checks that run project code" builds the project's Python
#   packages for pip-audit and runs its access-rule tests. Code that runs
#   there can still interfere with those two checks.
# - "Security checks (security-kit)" decides pass or fail on a fresh
#   machine (checks/gate.py), from GitHub's record of how each check step
#   ended. A result missing from that record counts as a failure: GitHub
#   drops a result whose text a step registered as a secret.
#
# In branch protection, require "<your job's name> / Security checks
# (security-kit)", for example "code / Security checks (security-kit)".
#
# Every job fetches the kit and moves it out before checking out the
# project. actions/checkout empties a folder that exists without .git before
# fetching into it, so the other order would wipe a project folder named
# .security-kit before any check saw it.
name: security-kit scans

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding the app; the secrets and workflow checks always cover the whole repository
        type: string
        default: "."
      semgrep-config:
        description: Semgrep rule set
        type: string
        default: "p/default"
      access-tests:
        description: The project's access-rule test files, relative to working-directory and separated by spaces. Leave empty to find them by name (test files with "access" in the name) for each ACCESS.md under working-directory or at the repository root
        type: string
        default: ""
      fail-on-findings:
        description: The kit's own self-test sets this to false to read results; for any other repository it is ignored and findings fail the check
        type: boolean
        default: true
      self-test-defect:
        description: Used only by the kit's own self-test; any other repository that sets it fails
        type: string
        default: ""
    outputs:
      results:
        description: "JSON: check name -> success or failure, from GitHub's record of each check step"
        value: >-
          {"secrets": "${{ jobs.read.outputs.secrets }}",
          "risky_code": "${{ jobs.read.outputs.risky_code }}",
          "pins": "${{ jobs.read.outputs.pins }}",
          "node_libraries": "${{ jobs.read.outputs.node_libraries }}",
          "python_libraries": "${{ jobs.run.outputs.python_libraries }}",
          "access_rules": "${{ jobs.run.outputs.access_rules }}"}
      evidence-read:
        description: "Filled only in the kit's own repository, for its self-test (empty everywhere else): JSON check name -> what the read-only checks' tools reported"
        value: ${{ jobs.read.outputs.evidence }}
      evidence-run:
        description: "Filled only in the kit's own repository, for its self-test (empty everywhere else): JSON check name -> what pip-audit and the access tests reported"
        value: ${{ jobs.run.outputs.evidence }}

permissions:
  contents: read

jobs:
  read:
    name: Run the checks that only read the project (security-kit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The four check values are GitHub's own record of how each check step
    # ended; no script writes them. evidence is written by a script, is
    # filled only in the kit's own repository for its self-test, and never
    # decides a project's verdict.
    outputs:
      secrets: ${{ steps.secrets.outcome }}
      risky_code: ${{ steps.risky_code.outcome }}
      pins: ${{ steps.pins.outcome }}
      node_libraries: ${{ steps.node_libraries.outcome }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - name: Refuse events that check out the wrong code
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::security-kit can't run from $EVENT: that event checks out the base branch, not the change, so every change would pass. Call it from push or pull_request."
          exit 1

      - name: Fetch the kit's own scripts, at the same version as this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-kit
          persist-credentials: false

      # GitHub names the kit's own repository and commit for this job. If
      # either were empty, actions/checkout would fetch the project's
      # repository or the kit's newest commit instead, and those files would
      # run as the kit. So the files fetched must be exactly that commit.
      - name: Check the kit's files are this workflow's own commit
        env:
          WANT_REPO: ${{ job.workflow_repository }}
          WANT_SHA: ${{ job.workflow_sha }}
          KIT_DIR: .security-kit
        run: |
          if [ -z "$WANT_REPO" ] || [ -z "$WANT_SHA" ]; then
            echo "::error::GitHub didn't name the kit's repository and commit for this job, so the kit's files can't be trusted."
            exit 1
          fi
          got_sha=$(git -C "$KIT_DIR" rev-parse HEAD)
          got_url=$(git -C "$KIT_DIR" remote get-url origin)
          if [ "$got_sha" != "$WANT_SHA" ] || [ "$got_url" != "$GITHUB_SERVER_URL/$WANT_REPO" ]; then
            echo "::error::The kit's files are $got_url at $got_sha, not $WANT_REPO at $WANT_SHA."
            exit 1
          fi
          echo "The kit's files are $WANT_REPO at $WANT_SHA."

      # Each check also writes its tool's report to $RUNNER_TEMP/reports.
      # Semgrep writes from its own container, so that folder is open to it.
      - name: Move the kit's files out, before the project is checked out
        run: |
          mv .security-kit "$RUNNER_TEMP/security-kit"
          mkdir -p "$RUNNER_TEMP/reports"
          chmod 777 "$RUNNER_TEMP/reports"
          : > "$RUNNER_TEMP/no-gitleaksignore"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Plant a known defect (kit self-test only)
        if: inputs.self-test-defect != ''
        env:
          DEFECT: ${{ inputs.self-test-defect }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then
            echo "::error::self-test-defect is for the kit's own self-test only."
            exit 1
          fi
          python -I "$RUNNER_TEMP/security-kit/selftest/plant.py" "$DEFECT" "$WD"
          git add -A
          git -c user.name=self-test -c user.email=self-test@example.invalid commit -q -m "self-test: plant $DEFECT"

      # The kit uses its own scanner settings. This lists the project's
      # settings files it ignores and the inline skip comments it respects.
      - name: Scanner settings in the project
        run: python -I "$RUNNER_TEMP/security-kit/checks/inventory.py" settings .

      # The checksum is recorded here, not read from the release, so a
      # replaced download can't bring its own matching checksum. Update both
      # together when the watcher reports a new gitleaks.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl --proto =https --tlsv1.2 -sSfLO -- "$base/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - id: secrets
        name: Leaked secrets in the history (gitleaks)
        continue-on-error: true
        run: |
          # A project's .gitattributes can mark a file as binary (-diff),
          # which makes git show its history as "Binary files differ".
          # .git/info/attributes overrides it, so gitleaks sees every file.
          printf '* diff\n' >> .git/info/attributes
          gitleaks git -v --redact --no-banner \
            --config "$RUNNER_TEMP/security-kit/checks/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore" \
            --report-format json --report-path "$RUNNER_TEMP/reports/gitleaks.json" .

      - id: risky_code
        name: Risky code patterns (Semgrep)
        continue-on-error: true
        env:
          CONFIG: ${{ inputs.semgrep-config }}
        run: |
          # A project's .semgrepignore files could hide code; the kit's own
          # replaces them, and no file is skipped for its size. Committed
          # files that .gitignore lists are scanned too (self-test
          # gitignored-risky-code).
          find . -name .semgrepignore -not -path './.git/*' -delete
          cp -- "$RUNNER_TEMP/security-kit/checks/semgrepignore" .semgrepignore
          status=0
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/reports:/reports" -w /src \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config "$CONFIG" --error --metrics off --quiet --max-target-bytes=0 \
            --json-output=/reports/semgrep.json "$WD" || status=$?
          python -I "$RUNNER_TEMP/security-kit/checks/inventory.py" semgrep-errors "$RUNNER_TEMP/reports/semgrep.json" "$RUNNER_TEMP/reports" || status=1
          exit $status

      - id: pins
        name: Libraries and actions pinned to exact versions
        continue-on-error: true
        run: python -I "$RUNNER_TEMP/security-kit/checks/pins.py" "$WD" --report "$RUNNER_TEMP/reports/pins.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/npm-shrinkwrap.json', inputs.working-directory)) != ''
        with:
          node-version: "22"

      - id: node_libraries
        name: JavaScript libraries with known holes (npm audit, high and critical)
        continue-on-error: true
        # Every npm lockfile under the folder, each audited from a clean copy
        # against the public registry; other JavaScript lockfiles fail as not
        # checked (checks/inventory.py).
        run: python -I "$RUNNER_TEMP/security-kit/checks/inventory.py" npm-audit "$WD" "$RUNNER_TEMP/reports"

      # In the kit's own repository only: list what each check's tool
      # reported, so the self-test can prove each catch is the defect it
      # planted. Every other repository skips this, and the verdict never
      # reads it.
      - id: evidence
        name: What each check reported (kit's own repository only)
        if: always()
        env:
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then echo "Only the kit's own repository uses this."; exit 0; fi
          evidence=$(python -I "$RUNNER_TEMP/security-kit/checks/findings.py" evidence-code "$RUNNER_TEMP/reports" secrets risky_code pins node_libraries)
          echo "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

  run:
    name: Run the checks that run project code (security-kit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub's own record of how each check step ended. These two checks run
    # the project's code (building its Python packages, running its tests),
    # which can still interfere with them; that code never runs where the
    # read-only checks are recorded.
    outputs:
      python_libraries: ${{ steps.python_libraries.outcome }}
      access_rules: ${{ steps.access_rules.outcome }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - name: Refuse events that check out the wrong code
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::security-kit can't run from $EVENT: that event checks out the base branch, not the change, so every change would pass. Call it from push or pull_request."
          exit 1

      - name: Fetch the kit's own scripts, at the same version as this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-kit
          persist-credentials: false

      # GitHub names the kit's own repository and commit for this job. If
      # either were empty, actions/checkout would fetch the project's
      # repository or the kit's newest commit instead, and those files would
      # run as the kit. So the files fetched must be exactly that commit.
      - name: Check the kit's files are this workflow's own commit
        env:
          WANT_REPO: ${{ job.workflow_repository }}
          WANT_SHA: ${{ job.workflow_sha }}
          KIT_DIR: .security-kit
        run: |
          if [ -z "$WANT_REPO" ] || [ -z "$WANT_SHA" ]; then
            echo "::error::GitHub didn't name the kit's repository and commit for this job, so the kit's files can't be trusted."
            exit 1
          fi
          got_sha=$(git -C "$KIT_DIR" rev-parse HEAD)
          got_url=$(git -C "$KIT_DIR" remote get-url origin)
          if [ "$got_sha" != "$WANT_SHA" ] || [ "$got_url" != "$GITHUB_SERVER_URL/$WANT_REPO" ]; then
            echo "::error::The kit's files are $got_url at $got_sha, not $WANT_REPO at $WANT_SHA."
            exit 1
          fi
          echo "The kit's files are $WANT_REPO at $WANT_SHA."

      - name: Move the kit's files out, before the project is checked out
        run: |
          mv .security-kit "$RUNNER_TEMP/security-kit"
          mkdir -p "$RUNNER_TEMP/reports"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Plant a known defect (kit self-test only)
        if: inputs.self-test-defect != ''
        env:
          DEFECT: ${{ inputs.self-test-defect }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then
            echo "::error::self-test-defect is for the kit's own self-test only."
            exit 1
          fi
          python -I "$RUNNER_TEMP/security-kit/selftest/plant.py" "$DEFECT" "$WD"
          git add -A
          git -c user.name=self-test -c user.email=self-test@example.invalid commit -q -m "self-test: plant $DEFECT"

      # pip-audit and every library it needs, pinned with hashes
      # (checks/pip-audit-requirements.txt, regenerated by RELEASING.md).
      - name: Install pip-audit (hash-pinned)
        run: pip install --quiet --require-hashes --no-deps -r "$RUNNER_TEMP/security-kit/checks/pip-audit-requirements.txt"

      # Requirements files and pyproject projects; Python manifests pip-audit
      # can't read fail as not checked (checks/inventory.py).
      - id: python_libraries
        name: Python libraries with known holes (pip-audit)
        continue-on-error: true
        run: python -I "$RUNNER_TEMP/security-kit/checks/inventory.py" pip-audit "$WD" "$RUNNER_TEMP/reports"

      # The tests named in access-tests, or else the test files with "access"
      # in their name, for each ACCESS.md under the working folder or at the
      # repository root. Each runs from the folder holding its requirements,
      # with the project's pytest settings overridden. An ACCESS.md with no
      # access tests, or a run where no test ran, fails as not checked.
      - id: access_rules
        name: Every route has an access rule (the project's access tests)
        continue-on-error: true
        env:
          TESTS: ${{ inputs.access-tests }}
        # TESTS is split on spaces on purpose: one or more test files.
        run: python -I "$RUNNER_TEMP/security-kit/checks/inventory.py" access-tests "$WD" "$RUNNER_TEMP/reports" $TESTS

      - id: evidence
        name: What each check reported (kit's own repository only)
        if: always()
        env:
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then echo "Only the kit's own repository uses this."; exit 0; fi
          evidence=$(python -I "$RUNNER_TEMP/security-kit/checks/findings.py" evidence-code "$RUNNER_TEMP/reports" python_libraries access_rules)
          echo "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

  verdict:
    name: Security checks (security-kit)
    needs: [read, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A fresh machine: none of the project's code has run here. Only the
      # kit's own files are fetched, at the same version as this workflow.
      - name: Fetch the kit's decision script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kit
          persist-credentials: false

      # GitHub names the kit's own repository and commit for this job. If
      # either were empty, actions/checkout would fetch the project's
      # repository or the kit's newest commit instead, and those files would
      # run as the kit. So the files fetched must be exactly that commit.
      - name: Check the kit's files are this workflow's own commit
        env:
          WANT_REPO: ${{ job.workflow_repository }}
          WANT_SHA: ${{ job.workflow_sha }}
          KIT_DIR: kit
        run: |
          if [ -z "$WANT_REPO" ] || [ -z "$WANT_SHA" ]; then
            echo "::error::GitHub didn't name the kit's repository and commit for this job, so the kit's files can't be trusted."
            exit 1
          fi
          got_sha=$(git -C "$KIT_DIR" rev-parse HEAD)
          got_url=$(git -C "$KIT_DIR" remote get-url origin)
          if [ "$got_sha" != "$WANT_SHA" ] || [ "$got_url" != "$GITHUB_SERVER_URL/$WANT_REPO" ]; then
            echo "::error::The kit's files are $got_url at $got_sha, not $WANT_REPO at $WANT_SHA."
            exit 1
          fi
          echo "The kit's files are $WANT_REPO at $WANT_SHA."

      - name: Decide from GitHub's record of each check (checks/gate.py)
        env:
          NEEDS: ${{ toJSON(needs) }}
          ASKED_REPORT_ONLY: ${{ !inputs.fail-on-findings }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: python3 -I kit/checks/gate.py
