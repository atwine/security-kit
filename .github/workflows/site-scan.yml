# security-kit: a look-only scan of the running website (OWASP ZAP baseline).
#
# Starts the project's app inside the GitHub job, waits until it answers,
# then lets ZAP follow its links and read every response. ZAP sends no
# attacks. Missing protective headers, insecure cookies and an open
# cross-site policy fail the scan (checks/zap-baseline.conf); smaller
# issues are reported as warnings.
#
# Two jobs. "Run the website scan" runs the app and ZAP and lets GitHub
# record how the scan ended. "Website scan (security-kit, ZAP baseline)"
# then decides pass or fail on a fresh machine, from that record; a missing
# result fails. In branch protection, require "<your job's name> / Website
# scan (security-kit, ZAP baseline)", for example "website / Website scan
# (security-kit, ZAP baseline)".
#
# The scan has to run the project's app in the same job as ZAP, and GitHub's
# runners give that code administrator rights. The kit fetches itself before
# the project, sets the rules up before any project code runs, and checks them
# again just before the scan. The steps after the app starts ignore
# environment lines the app or its libraries add (SHELLOPTS, imported bash
# functions, loader and docker settings) and call commands by full path. A
# deliberately malicious app or dependency could still interfere with the
# scan itself: it runs as the same user, so it can rewrite the rules file
# between the check and the scan, and with administrator rights it can
# replace programs.
#
#   jobs:
#     website:
#       uses: atwine/security-kit/.github/workflows/site-scan.yml@<full commit SHA> # vX.Y.Z
#       with:
#         python-version: "3.12"
#         setup-command: pip install -r requirements.txt
#         start-command: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
#         url: http://127.0.0.1:8000/
name: security-kit site scan

on:
  workflow_call:
    inputs:
      url:
        description: Address ZAP starts from, usually the app's home page on 127.0.0.1
        type: string
        required: true
      working-directory:
        description: Folder the setup and start commands run in
        type: string
        default: "."
      python-version:
        description: Python version to install first (leave empty for none)
        type: string
        default: ""
      node-version:
        description: Node.js version to install first (leave empty for none)
        type: string
        default: ""
      setup-command:
        description: Command that installs the app (runs before the start command)
        type: string
        default: ""
      start-command:
        description: Command that starts the app; leave empty to scan an address that is already running
        type: string
        default: ""
      rules-file:
        description: The project's own ZAP rules file (relative to the repository root); defaults to the kit's
        type: string
        default: ""
      fail-on-findings:
        description: The kit's own self-test sets this to false to read the result; for any other repository it is ignored and a failed scan fails the check
        type: boolean
        default: true
      self-test-defect:
        description: Used only by the kit's own self-test; any other repository that sets it fails
        type: string
        default: ""
    outputs:
      results:
        description: "JSON: site_headers (ZAP) and site_policy (the kit's own check) -> success or failure, from GitHub's record of each step"
        value: '{"site_headers": "${{ jobs.scan.outputs.site_headers }}", "site_policy": "${{ jobs.scan.outputs.site_policy }}"}'
      evidence:
        description: "Filled only in the kit's own repository, for its self-test (empty everywhere else): JSON site_headers -> the failing ZAP rules it reported, site_policy -> the kit check's findings that weren't accepted"
        value: ${{ jobs.scan.outputs.evidence }}

permissions:
  contents: read

jobs:
  scan:
    name: Run the website scan (security-kit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # site_headers is GitHub's own record of how the scan step ended; no
    # script writes it. evidence is filled only in the kit's own repository,
    # for its self-test.
    outputs:
      site_headers: ${{ steps.site_headers.outcome }}
      site_policy: ${{ steps.site_policy.outcome }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    env:
      WD: ${{ inputs.working-directory }}
      URL: ${{ inputs.url }}
    steps:
      - name: Refuse events that check out the wrong code
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::security-kit can't run from $EVENT: that event checks out the base branch, not the change, so every change would pass. Call it from push or pull_request."
          exit 1

      # The kit first: actions/checkout empties a folder that exists without
      # .git before fetching into it, so fetching the kit after the project
      # would wipe a project folder named .security-kit.
      - name: Fetch the kit's own files, at the same version as this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-kit
          persist-credentials: false

      # GitHub names the kit's own repository and commit for this job. If
      # either were empty, actions/checkout would fetch the project's
      # repository or the kit's newest commit instead, and those files would
      # run as the kit. So the files fetched must be exactly that commit.
      - name: Check the kit's files are this workflow's own commit
        env:
          WANT_REPO: ${{ job.workflow_repository }}
          WANT_SHA: ${{ job.workflow_sha }}
          KIT_DIR: .security-kit
        run: |
          if [ -z "$WANT_REPO" ] || [ -z "$WANT_SHA" ]; then
            echo "::error::GitHub didn't name the kit's repository and commit for this job, so the kit's files can't be trusted."
            exit 1
          fi
          got_sha=$(git -C "$KIT_DIR" rev-parse HEAD)
          got_url=$(git -C "$KIT_DIR" remote get-url origin)
          if [ "$got_sha" != "$WANT_SHA" ] || [ "$got_url" != "$GITHUB_SERVER_URL/$WANT_REPO" ]; then
            echo "::error::The kit's files are $got_url at $got_sha, not $WANT_REPO at $WANT_SHA."
            exit 1
          fi
          echo "The kit's files are $WANT_REPO at $WANT_SHA."

      - name: Move the kit's files out, before the project is checked out
        env:
          KIT: ${{ runner.temp }}/security-kit
        run: mv .security-kit "$KIT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any of the project's code runs: give ZAP its own folder, copy
      # the rules there, and record their checksum.
      - id: prepare
        name: Set up the scan's own folder and rules
        env:
          RULES: ${{ inputs.rules-file }}
          ZAP_DIR: ${{ runner.temp }}/zap
          KIT: ${{ runner.temp }}/security-kit
        run: |
          mkdir -p "$ZAP_DIR"
          chmod 777 "$ZAP_DIR"
          if [ -n "$RULES" ]; then cp -- "$RULES" "$ZAP_DIR/rules.conf"; else cp -- "$KIT/checks/zap-baseline.conf" "$ZAP_DIR/rules.conf"; fi
          echo "rules_sha256=$(sha256sum "$ZAP_DIR/rules.conf" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Plant a known defect (kit self-test only)
        if: inputs.self-test-defect != ''
        env:
          DEFECT: ${{ inputs.self-test-defect }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
          KIT: ${{ runner.temp }}/security-kit
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then
            echo "::error::self-test-defect is for the kit's own self-test only."
            exit 1
          fi
          python3 -I "$KIT/selftest/plant.py" "$DEFECT" "$WD"

      - name: Install the app
        if: inputs.setup-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP: ${{ inputs.setup-command }}
        run: bash -c "$SETUP"

      - name: Start the app and wait until it answers
        if: inputs.start-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          START: ${{ inputs.start-command }}
        run: |
          nohup bash -c "$START" > "$RUNNER_TEMP/app.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --proto =http,https -s -o /dev/null -- "$URL"; then echo "The app answers."; exit 0; fi
            sleep 1
          done
          echo "The app didn't answer at $URL within 60 seconds. Its log:"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      # The project's code has run in this job by now, and it can change the
      # environment of later steps through $GITHUB_ENV. So this step and the
      # two after it close the routes that need only an environment line:
      # the loader variables are emptied for this step (a step's own env wins
      # over $GITHUB_ENV), bash starts in privileged mode (-p: no imported
      # functions, SHELLOPTS, BASHOPTS, BASH_ENV or ENV), and commands are
      # called by full path. This step also gives docker a fresh, empty
      # settings folder and checks the rules are the ones copied before any
      # project code ran. Code with administrator rights can still interfere
      # with the scan; see the note at the top.
      - id: site_headers
        name: ZAP baseline scan (looks only, sends no attacks)
        continue-on-error: true
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CONFIG /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          URL: ${{ inputs.url }}
          ZAP_DIR: ${{ runner.temp }}/zap
          RULES_SHA256: ${{ steps.prepare.outputs.rules_sha256 }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          DOCKER_CONFIG="$(/usr/bin/mktemp -d -p /tmp)"
          export DOCKER_CONFIG
          export DOCKER_HOST=unix:///var/run/docker.sock
          echo "$RULES_SHA256  $ZAP_DIR/rules.conf" | /usr/bin/sha256sum -c --quiet -
          # ZAP gets the rules without the kit's own KIT- lines. -silent stops
          # it downloading rule updates, so the pinned image's rules are used.
          /usr/bin/grep -v '^KIT-' "$ZAP_DIR/rules.conf" > "$ZAP_DIR/zap-rules.conf" || true
          /usr/bin/docker run --rm --network host -v "$ZAP_DIR:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t "$URL" -c zap-rules.conf -J report.json -I -z "-silent"

      # The protections ZAP can't see over plain HTTP: HSTS, Referrer-Policy,
      # Permissions-Policy, cookie Secure and SameSite flags, and CORS
      # (checks/site_policy.py). Same guarded shell as the scan.
      - id: site_policy
        name: HSTS, referrer and permissions policies, cookie flags and CORS (kit check)
        continue-on-error: true
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CONFIG /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          URL: ${{ inputs.url }}
          ZAP_DIR: ${{ runner.temp }}/zap
          KIT: ${{ runner.temp }}/security-kit
          RULES_SHA256: ${{ steps.prepare.outputs.rules_sha256 }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          echo "$RULES_SHA256  $ZAP_DIR/rules.conf" | /usr/bin/sha256sum -c --quiet -
          /usr/bin/python3 -I "$KIT/checks/site_policy.py" "$URL" "$ZAP_DIR/rules.conf" "$ZAP_DIR/site-policy.json"

      - name: List what ZAP found
        if: always()
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CONFIG /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          REPORT: ${{ runner.temp }}/zap/report.json
        run: |
          if [ ! -f "$REPORT" ]; then echo "No ZAP report."; exit 0; fi
          /usr/bin/python3 -I - <<'EOF'
          import json, os
          report = json.load(open(os.environ["REPORT"]))
          rows = [(a.get("riskdesc", ""), a.get("name", ""), a.get("pluginid", ""), a.get("count", "?"))
                  for site in report.get("site", []) for a in site.get("alerts", [])]
          for risk, name, rule, count in rows:
              print(f"{risk} | {name} | rule {rule} | {count} places")
          if not rows:
              print("ZAP reported nothing.")
          EOF

      - name: What each check found
        if: always()
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CONFIG /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          ZAP_DIR: ${{ runner.temp }}/zap
          KIT: ${{ runner.temp }}/security-kit
          SITE_HEADERS: ${{ steps.site_headers.outcome }}
          SITE_POLICY: ${{ steps.site_policy.outcome }}
        run: |
          /usr/bin/python3 -I "$KIT/checks/findings.py" summary-site "$ZAP_DIR"             "site_headers=$SITE_HEADERS" "site_policy=$SITE_POLICY" | /usr/bin/tee -a "$GITHUB_STEP_SUMMARY"

      # In the kit's own repository only: list the failing rules ZAP
      # reported, so the self-test can prove the catch is the defect it
      # planted. Every other repository skips this, and the verdict below
      # never reads it.
      - id: evidence
        name: What the scan reported (kit's own repository only)
        if: always()
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CONFIG /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          ZAP_DIR: ${{ runner.temp }}/zap
          KIT: ${{ runner.temp }}/security-kit
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          if [ "$REPO" != "$KIT_REPO" ]; then echo "Only the kit's own repository uses this."; exit 0; fi
          evidence=$(/usr/bin/python3 -I "$KIT/checks/findings.py" evidence-site "$ZAP_DIR")
          echo "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

  verdict:
    name: Website scan (security-kit, ZAP baseline)
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A fresh machine: none of the project's code has run here.
      - name: Decide from GitHub's record of the scan
        env:
          HEADERS: ${{ needs.scan.outputs.site_headers }}
          POLICY: ${{ needs.scan.outputs.site_policy }}
          SCAN: ${{ needs.scan.result }}
          ASKED_REPORT_ONLY: ${{ !inputs.fail-on-findings }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ job.workflow_repository }}
        run: |
          report_only=false
          if [ "$ASKED_REPORT_ONLY" = "true" ]; then
            if [ "$REPO" = "$KIT_REPO" ]; then
              report_only=true
            else
              echo "::warning::fail-on-findings: false only applies to the kit's own self-test. This project's scan still decides the check."
            fi
          fi
          problems=()
          { echo "| Check | Result |"; echo "|---|---|"; } | tee -a "$GITHUB_STEP_SUMMARY"
          for pair in "site_headers:$HEADERS:The step 'List what ZAP found'" "site_policy:$POLICY:The kit check's step"; do
            name="${pair%%:*}"; rest="${pair#*:}"; outcome="${rest%%:*}"; where="${rest#*:}"
            case "$outcome" in
              success) shown="success" ;;
              failure) shown="found something"; problems+=("$name found something. $where in the 'Run the website scan' job shows each finding.") ;;
              *) shown="${outcome:-no result}"; problems+=("$name did not run (${outcome:-no result}). A missing result counts as a failure.") ;;
            esac
            echo "| $name | $shown |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ "$SCAN" != "success" ]; then problems+=("The scan job ended with '$SCAN'."); fi
          if [ ${#problems[@]} -eq 0 ]; then exit 0; fi
          for problem in "${problems[@]}"; do
            if [ "$report_only" = "true" ]; then echo "::notice::$problem"; else echo "::error::$problem"; fi
          done
          if [ "$report_only" = "true" ]; then exit 0; fi
          exit 1
