# Phase 1 test only: a shared workflow that other repositories call, used to
# prove that callers can reach it and that Dependabot upgrades the version
# they pin. Removed before 1.0.0.
name: spike-hello

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hello:
    name: Kit test workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say which kit version ran
        run: echo "security-kit test workflow, release 1"
