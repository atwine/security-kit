# The kit scans itself with its own checks, on every push and pull request,
# and weekly so newly published holes show up even when nothing changes.
name: security-scans

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scans:
    uses: ./.github/workflows/scans.yml

  score:
    needs: scans
    if: always()
    uses: ./.github/workflows/score.yml
    with:
      code-results: ${{ needs.scans.outputs.results }}
