# The kit proves itself: plant one known defect at a time into the fixture
# app, run the kit's real checks, and require that the clean app passes
# everything with nothing reported, that each defect makes its own check
# fail with the planted item named in that check's report, and that every
# other check still passes. selftest/verdict.py decides; its tests are in
# selftest/test_verdict.py.
name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, because Semgrep's default rules are fetched live (the rules
  # licence keeps the kit from pinning a copy): a rule change that breaks a
  # catch shows up within days.
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  clean:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false

  secret:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: secret

  vulnerable-library:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: vulnerable-library

  node-library:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: node-library

  risky-code:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: risky-code

  unpinned-library:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: unpinned-library

  unruled-route:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: unruled-route

  forge-verdict:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: forge-verdict

  mask-failure:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: mask-failure

  hidden-folder-code:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: hidden-folder-code

  env-folder-pin:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: env-folder-pin

  pin-included-file:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: pin-included-file

  pin-workflow-image:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: pin-workflow-image

  pin-precommit-tag:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: pin-precommit-tag

  npm-subfolder:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: npm-subfolder

  yarn-lockfile:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: yarn-lockfile

  pyproject-library:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: pyproject-library

  renamed-access-tests:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: renamed-access-tests

  missing-access-tests:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: missing-access-tests

  gitleaks-config:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: gitleaks-config

  semgrepignore:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: semgrepignore

  npmrc-registry:
    uses: ./.github/workflows/scans.yml
    with:
      working-directory: selftest/fixture-app
      fail-on-findings: false
      self-test-defect: npmrc-registry

  site-clean:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false

  site-missing-headers:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: missing-headers

  site-no-hsts:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-no-hsts

  site-no-referrer-permissions:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-no-referrer-permissions

  site-insecure-cookie:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-insecure-cookie

  site-cors-wildcard:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-cors-wildcard

  site-redirect-cookie:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-redirect-cookie

  site-env-bypass-policy:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: echo SHELLOPTS=noexec >> "$GITHUB_ENV"; python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: site-no-hsts

  # The app's start command also writes SHELLOPTS=noexec to $GITHUB_ENV, as
  # a library's install or start-up code could. A bash step that doesn't
  # guard against it then reads its script, runs nothing and passes.
  site-env-bypass:
    uses: ./.github/workflows/site-scan.yml
    with:
      working-directory: selftest/fixture-app
      python-version: "3.12"
      setup-command: pip install -r requirements.txt
      start-command: echo SHELLOPTS=noexec >> "$GITHUB_ENV"; python -m uvicorn app:app --host 127.0.0.1 --port 8000
      url: http://127.0.0.1:8000/
      fail-on-findings: false
      self-test-defect: missing-headers

  watcher:
    name: The watcher reports planted changes and stays quiet otherwise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the watcher's tests (no network)
        run: python -m unittest discover -s watch -v

  # The watcher can stop without anyone noticing: its runs can keep failing,
  # or GitHub can pause its schedule. This check runs on every push and pull
  # request and weekly, and fails when the watcher hasn't succeeded in 40 days.
  # GitHub emails a failed scheduled run to whoever last changed the schedule,
  # if their notification settings allow it. Forks have no watcher runs, so
  # the check passes there with a note.
  watcher-recent:
    name: The watcher succeeded in the last 40 days
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ask GitHub when the watcher last succeeded
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "This is a fork, which runs no watcher, so there is nothing to check."
            exit 0
          fi
          python -I watch/watch.py --repo "$REPO" --check-recent

  self-test-rules:
    name: The self-test's verdict and report readers pass their tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the tests (no network)
        run: |
          status=0
          python -m unittest discover -s selftest -p "test_*.py" -v || status=1
          python -m unittest discover -s checks -p "test_*.py" -v || status=1
          exit $status

  # Keep this job's name: main's protection rule requires a check by this name.
  verdict:
    name: Each planted defect is caught, and the clean app passes
    needs: [clean, secret, vulnerable-library, node-library, risky-code, unpinned-library, unruled-route,
            forge-verdict, mask-failure, hidden-folder-code, env-folder-pin, site-clean, site-missing-headers,
            site-env-bypass, npm-subfolder, yarn-lockfile, pyproject-library, renamed-access-tests,
            missing-access-tests, gitleaks-config, semgrepignore, npmrc-registry, site-no-hsts,
            site-no-referrer-permissions, site-insecure-cookie, site-cors-wildcard, site-redirect-cookie,
            site-env-bypass-policy, pin-included-file, pin-workflow-image, pin-precommit-tag,
            watcher, watcher-recent, self-test-rules]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with what must happen (selftest/verdict.py)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I selftest/verdict.py
